<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokedex</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;800&display=swap" rel="stylesheet">
</head>

<link rel="stylesheet" href="./src/css/reset.css">
<link rel="stylesheet" href="./src/css/styles.css">
<link rel="stylesheet" href="./src/css/scrollbar.css">

<body>
    <header>
        <a href="#">
            <img src="./src/imagens/pokeball.png" alt="pokebola" class="logo">
        </a>

        <button id="button-alter-theme">
            <img src="./src/imagens/sun.png" alt="sol" class="button-image">
        </button>
    </header>
    <main>
        <!-- Hero Section -->
        <section class="hero-section">
            <div class="hero-content">
                <h1 class="hero-title">Pokédex Completa</h1>
                <p class="hero-subtitle">Explore todos os 1025 pokemons de todas as 9 gerações</p>
                <div class="hero-stats">
                    <div class="stat-card">
                        <span class="stat-number" id="total-pokemons">1025</span>
                        <span class="stat-label">Pokemons</span>
                    </div>
                    <div class="stat-card">
                        <span class="stat-number">9</span>
                        <span class="stat-label">Gerações</span>
                    </div>
                    <div class="stat-card">
                        <span class="stat-number">18</span>
                        <span class="stat-label">Tipos</span>
                    </div>
                </div>
                <div class="hero-controls">
                    <button id="expand-all" class="control-button">Expandir Todas</button>
                    <button id="collapse-all" class="control-button">Colapsar Todas</button>
                </div>
            </div>
        </section>

        <!-- Barra de Busca e Filtros -->
        <section class="search-section">
            <div class="search-container">
                <div class="search-box">
                    <input type="text" id="search-input" placeholder="Buscar pokemon por nome ou número..." class="search-input">
                    <span class="search-icon">🔍</span>
                </div>
                <div class="filter-container">
                    <select id="type-filter" class="filter-select">
                        <option value="">Todos os Tipos</option>
                        <option value="normal">Normal</option>
                        <option value="fire">Fogo</option>
                        <option value="water">Água</option>
                        <option value="electric">Elétrico</option>
                        <option value="grass">Grama</option>
                        <option value="ice">Gelo</option>
                        <option value="fighting">Lutador</option>
                        <option value="poison">Veneno</option>
                        <option value="ground">Terra</option>
                        <option value="flying">Voador</option>
                        <option value="psychic">Psíquico</option>
                        <option value="bug">Inseto</option>
                        <option value="rock">Pedra</option>
                        <option value="ghost">Fantasma</option>
                        <option value="dragon">Dragão</option>
                        <option value="dark">Sombrio</option>
                        <option value="steel">Aço</option>
                        <option value="fairy">Fada</option>
                    </select>
                    <select id="generation-filter" class="filter-select">
                        <option value="">Todas as Gerações</option>
                        <option value="1">Geração I - Kanto</option>
                        <option value="2">Geração II - Johto</option>
                        <option value="3">Geração III - Hoenn</option>
                        <option value="4">Geração IV - Sinnoh</option>
                        <option value="5">Geração V - Unova</option>
                        <option value="6">Geração VI - Kalos</option>
                        <option value="7">Geração VII - Alola</option>
                        <option value="8">Geração VIII - Galar</option>
                        <option value="9">Geração IX - Paldea</option>
                    </select>
                    <button id="clear-filters" class="clear-button">Limpar Filtros</button>
                </div>
                <div id="search-results-count" class="results-count"></div>
            </div>
        </section>

        <section class="generation-section" id="generation-1">
            <h2 class="generation-title">Geração I - Kanto</h2>
            <ul class="list-pokemon">
                <!-- Pokemons serão carregados dinamicamente via JavaScript -->
            </ul>
        </section>

        <section class="generation-section" id="generation-2">
            <h2 class="generation-title">Geração II - Johto</h2>
            <ul class="list-pokemon">
                <!-- Pokemons da Geração II serão adicionados aqui -->
            </ul>
        </section>

        <section class="generation-section" id="generation-3">
            <h2 class="generation-title">Geração III - Hoenn</h2>
            <ul class="list-pokemon">
                <!-- Pokemons da Geração III serão adicionados aqui -->
            </ul>
        </section>

        <section class="generation-section" id="generation-4">
            <h2 class="generation-title">Geração IV - Sinnoh</h2>
            <ul class="list-pokemon">
                <!-- Pokemons da Geração IV serão adicionados aqui -->
            </ul>
        </section>

        <section class="generation-section" id="generation-5">
            <h2 class="generation-title">Geração V - Unova</h2>
            <ul class="list-pokemon">
                <!-- Pokemons da Geração V serão adicionados aqui -->
            </ul>
        </section>

        <section class="generation-section" id="generation-6">
            <h2 class="generation-title">Geração VI - Kalos</h2>
            <ul class="list-pokemon">
                <!-- Pokemons da Geração VI serão adicionados aqui -->
            </ul>
        </section>

        <section class="generation-section" id="generation-7">
            <h2 class="generation-title">Geração VII - Alola</h2>
            <ul class="list-pokemon">
                <!-- Pokemons da Geração VII serão adicionados aqui -->
            </ul>
        </section>

        <section class="generation-section" id="generation-8">
            <h2 class="generation-title">Geração VIII - Galar</h2>
            <ul class="list-pokemon">
                <!-- Pokemons da Geração VIII serão adicionados aqui -->
            </ul>
        </section>

        <section class="generation-section" id="generation-9">
            <h2 class="generation-title">Geração IX - Paldea</h2>
            <ul class="list-pokemon">
                <!-- Pokemons da Geração IX serão adicionados aqui -->
            </ul>
        </section>
    </main>

    <script src="./src/js/index.js"></script>
</body>

</html>
